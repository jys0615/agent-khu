name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # GHCR push 권한

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  RESOURCE_GROUP: agent-khu-rg
  BACKEND_APP: agent-khu-backend
  FRONTEND_APP: agent-khu-frontend

jobs:
  # ── 1. Build & Push images to GHCR ───────────────────────────────────────
  build-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/agent-khu-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/agent-khu-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/agent-khu-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/agent-khu-frontend:latest
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to Azure Container Apps ────────────────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 20
    if: ${{ secrets.AZURE_CREDENTIALS != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Backend ──────────────────────────────────────────
      - name: Deploy backend
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image ${{ env.IMAGE_PREFIX }}/agent-khu-backend:${{ github.sha }}

      # ── Frontend ─────────────────────────────────────────
      - name: Deploy frontend
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image ${{ env.IMAGE_PREFIX }}/agent-khu-frontend:${{ github.sha }}

      - name: Print deployment URLs
        run: |
          echo "=== Deployment complete ==="
          BACKEND_URL=$(az containerapp show -n $BACKEND_APP -g $RESOURCE_GROUP --query properties.configuration.ingress.fqdn -o tsv)
          FRONTEND_URL=$(az containerapp show -n $FRONTEND_APP -g $RESOURCE_GROUP --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend:  https://$BACKEND_URL"
          echo "Frontend: https://$FRONTEND_URL"
