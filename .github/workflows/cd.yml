name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ACR_NAME: agentkhuacr
  RESOURCE_GROUP: agent-khu-rg
  BACKEND_APP: agent-khu-backend
  FRONTEND_APP: agent-khu-frontend

jobs:
  # ── 1. Build & Push images to ACR ────────────────────────────────────────
  build-push:
    name: Build & push images to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name $ACR_NAME

      - uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/frontend:latest
          build-args: |
            VITE_API_URL=https://${{ env.BACKEND_APP }}.$(az containerapp env show -n agent-khu-env -g ${{ env.RESOURCE_GROUP }} --query properties.defaultDomain -o tsv 2>/dev/null || echo 'placeholder')
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to Azure Container Apps ────────────────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Backend ──────────────────────────────────────────
      - name: Deploy backend
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/backend:${{ github.sha }} \
            --set-env-vars \
              ANTHROPIC_API_KEY=secretref:anthropic-api-key \
              GROQ_API_KEY=secretref:groq-api-key \
              DATABASE_URL=secretref:database-url \
              REDIS_URL=secretref:redis-url \
              ELASTICSEARCH_URL=secretref:elasticsearch-url \
              SECRET_KEY=secretref:secret-key \
              ALLOWED_ORIGINS=secretref:allowed-origins \
              MCP_CLASSROOM_URL=http://localhost:8101/mcp \
              MCP_NOTICE_URL=http://localhost:8102/mcp \
              MCP_MEAL_URL=http://localhost:8103/mcp \
              MCP_LIBRARY_URL=http://localhost:8104/mcp \
              MCP_COURSE_URL=http://localhost:8105/mcp \
              MCP_CURRICULUM_URL=http://localhost:8106/mcp \
              MCP_SHUTTLE_URL=http://localhost:8107/mcp \
              OLLAMA_ENABLED=false

      # ── Frontend ─────────────────────────────────────────
      - name: Deploy frontend
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/frontend:${{ github.sha }}

      - name: Print deployment URLs
        run: |
          echo "=== Deployment complete ==="
          BACKEND_URL=$(az containerapp show -n $BACKEND_APP -g $RESOURCE_GROUP --query properties.configuration.ingress.fqdn -o tsv)
          FRONTEND_URL=$(az containerapp show -n $FRONTEND_APP -g $RESOURCE_GROUP --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend:  https://$BACKEND_URL"
          echo "Frontend: https://$FRONTEND_URL"
